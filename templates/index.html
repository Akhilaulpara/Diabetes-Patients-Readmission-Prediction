<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Diabetic Readmission — Upload</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg,#2b5876 0%, #4e4376 100%);
      min-height:100vh;
      padding:48px 12px;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      color:#0f172a;
    }
    .card { border-radius:14px; padding:22px; box-shadow:0 10px 30px rgba(2,6,23,0.18); }
    .btn-primary { background:linear-gradient(90deg,#8e2de2,#4a00e0); border:none; }
    .small-muted { color:#6b7280; }
  </style>
</head>
<body>
  <div class="container">
    <div class="col-lg-8 mx-auto">
      <div class="card">
        <h3 class="mb-1">🩺 Diabetic Readmission Predictor</h3>
        <p class="small-muted">Upload a CSV containing patient features or use the provided sample dataset.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mt-3">
              {% for category, msg in messages %}
                <div class="alert alert-{{ 'danger' if category=='danger' else ( 'warning' if category=='warning' else 'info' ) }}">{{ msg }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="post" enctype="multipart/form-data" action="/predict" class="mt-3">
          <div class="mb-3">
            <label class="form-label">CSV File</label>
            <input class="form-control" type="file" name="file" accept=".csv">
          </div>

          <div class="mb-3">
            <label class="form-label">Model</label>
            <select name="model" class="form-select">
              {% for m in models %}
                <option value="{{ m }}">{{ m.replace('_',' ').title() }}</option>
              {% endfor %}
            </select>
          </div>

          <input type="hidden" id="use_sample" name="use_sample" value="false">
          <div class="d-flex gap-2">
            <button class="btn btn-primary">Predict</button>
            <button id="sampleBtn" type="button" class="btn btn-outline-light">Use Sample</button>
            <a class="btn btn-link text-white" href="{{ sample_path }}" target="_blank">Open sample CSV</a>
          </div>

          <div class="mt-3 small-muted"><!--<strong>Sample path:</strong> <code>{{ sample_path }}</code>--></div>
        </form>
      </div>
    </div>
  </div>

<script>
  document.getElementById("sampleBtn").addEventListener("click", function() {
    document.getElementById("use_sample").value = "true";
    document.forms[0].submit();
  });
</script>
</body>
</html>
